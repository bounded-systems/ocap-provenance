name: standard
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  standard:
    uses: bounded-systems/.github/.github/workflows/repo-standard.yml@34f4785c4602c8a65d4e12e858f8ef7ce972d2ef
    with:
      security: true
      test: true
      runtime: bun
      test-command: "bun install --frozen-lockfile && bun test"
